networks:
  app-network:
    driver: bridge
  keycloak-network:
    driver: bridge

volumes:
  postgres-game-data:
  postgres-statistics-data:
  postgres-keycloak-data:
  prometheus-data:
  kafka-data:

services:
  gateway:
    image: ghcr.io/${GITHUB_OWNER}/gateway:${IMAGE_TAG}
    container_name: gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      - identity-service
      - game-service
      - statistics-service
    networks:
      - app-network
    environment:
      - HTTP_MODE=${HTTP_MODE}
      - IDENTITY_SERVICE_HOST=identity-service
      - GAME_SERVICE_HOST=game-service
      - STATISTICS_SERVICE_HOST=statistics-service
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
    restart: unless-stopped

  identity-service:
    image: ghcr.io/${GITHUB_OWNER}/identity:${IMAGE_TAG}
    container_name: identity-service
    ports:
      - "50052:50052"
    networks:
      - app-network
    environment:
      - GRPC_HOST=0.0.0.0
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_PUBLIC_CLIENT_ID=${KEYCLOAK_PUBLIC_CLIENT_ID}
      - KEYCLOAK_PUBLIC_CLIENT_SECRET=${KEYCLOAK_PUBLIC_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
    restart: unless-stopped

  game-service:
    image: ghcr.io/${GITHUB_OWNER}/game:${IMAGE_TAG}
    container_name: game-service
    ports:
      - "50051:50051"
    depends_on:
      - postgres-game
      - redis
      - kafka
    networks:
      - app-network
    environment:
      - POSTGRES_HOST=postgres-game
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GRPC_HOST=0.0.0.0
      - REDIS_ADDRESS=redis:6379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_GAME_COMPLETED=game-completed
    restart: unless-stopped

  statistics-service:
    image: ghcr.io/${GITHUB_OWNER}/statistics:${IMAGE_TAG}
    container_name: statistics-service
    ports:
      - "50053:50053"
    depends_on:
      - postgres-statistics
      - kafka
    networks:
      - app-network
    environment:
      - POSTGRES_HOST=postgres-statistics
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GRPC_HOST=0.0.0.0
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_GROUP_ID=statistics-service
      - KAFKA_TOPIC_GAME_COMPLETED=game-completed
    restart: unless-stopped

  postgres-game:
    image: postgres:18-alpine
    container_name: postgres-game
    ports:
      - "5432:5432"
    networks:
      - app-network
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - postgres-game-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-statistics:
    image: postgres:18-alpine
    container_name: postgres-statistics
    ports:
      - "5433:5432"
    networks:
      - app-network
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - postgres-statistics-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    ports:
      - "8088:8080"
    networks:
      - app-network
      - keycloak-network
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-keycloak:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USERNAME}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    command: [ "start-dev", "--import-realm" ]
    depends_on:
      - postgres-keycloak
    restart: unless-stopped

  postgres-keycloak:
    image: postgres:18-alpine
    container_name: postgres-keycloak
    networks:
      - keycloak-network
    environment:
      - POSTGRES_USER=${KEYCLOAK_DB_USERNAME}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - POSTGRES_DB=keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    ports:
      - "9000:9090"
    networks:
      - app-network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - app-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNkYwNkJCMzJBQg==
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    networks:
      - app-network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
