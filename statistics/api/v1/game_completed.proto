syntax = "proto3";

package statistics.v1;

option go_package = "gordle/statistics/pkg/protogen/statistics/v1;statisticsv1";

message GameCompletedEvent {
  string user_id = 1;
  string session_id = 2;
  string game_mode = 3;
  string game_date = 4;
  string target_word = 5;
  repeated string guesses = 6;
  string result = 7;
  int32 attempts_used = 8;
}
