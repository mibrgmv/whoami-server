name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      gateway: ${{ steps.filter.outputs.gateway }}
      quiz: ${{ steps.filter.outputs.quiz }}
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      history: ${{ steps.filter.outputs.history }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - '.golangci.yml'
            gateway:
              - 'services/gateway/**'
            quiz:
              - 'services/quiz/**'
            auth:
              - 'services/auth/**'
            user:
              - 'services/user/**'
            history:
              - 'services/history/**'

  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-go
        with:
          working-directory: shared

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-go
        with:
          working-directory: services/gateway

  quiz:
    needs: changes
    if: needs.changes.outputs.quiz == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-go
        with:
          working-directory: services/quiz

  auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-go
        with:
          working-directory: services/auth

  user:
    needs: changes
    if: needs.changes.outputs.user == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-go
        with:
          working-directory: services/user

  history:
    needs: changes
    if: needs.changes.outputs.history == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-go
        with:
          working-directory: services/history
