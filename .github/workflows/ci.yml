name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.24'

jobs:
  lint:
    name: Lint / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - services/gateway
          - services/quiz
          - services/auth
          - services/user
          - services/history
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/lint-go
        with:
          module: ${{ matrix.module }}
          go-version: ${{ env.GO_VERSION }}

  test:
    name: Test / ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - services/gateway
          - services/quiz
          - services/auth
          - services/user
          - services/history
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/test-go
        with:
          module: ${{ matrix.module }}
          go-version: ${{ env.GO_VERSION }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - quiz
          - auth
          - user
          - history
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start dependencies
        working-directory: deployments/docker
        run: |
          docker compose up -d postgres-quiz postgres-history redis
          sleep 10

      - uses: ./.github/actions/setup-go
        with:
          module: services/quiz
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        working-directory: services/quiz
        run: go test -v -tags=integration ./...
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_ADDRESS: localhost:6379

      - name: Cleanup
        if: always()
        working-directory: deployments/docker
        run: docker compose down -v
