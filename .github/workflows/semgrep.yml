name: Semgrep SAST

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
