name: Build Gateway

on:
  push:
    branches: [main, develop]
    paths:
      - 'gateway/**'
      - 'libs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'gateway/**'
      - 'libs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-go
        with:
          service: gateway
