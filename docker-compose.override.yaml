services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        SERVICE: gateway
    environment:
      - KEYCLOAK_BASE_URL=http://keycloak:8080

  game-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: game
      args:
        SERVICE: game

  iam-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: iam
      args:
        SERVICE: iam
    environment:
      - KEYCLOAK_BASE_URL=http://keycloak:8080

  statistics-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: statistics
      args:
        SERVICE: statistics
